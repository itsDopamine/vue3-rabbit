events {}

http {
    include    /etc/nginx/mime.types;
    upstream backend {
          server 10.229.10.90:3001;
          server 10.229.10.90:3002;
          server 10.229.10.90:3003;
    }

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ index.html;
            # don't cache index.html, otherwise people don't get app udpates
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # do cache static assets, because the built app has a different .js name after changes
        # location /static {
        #     root /usr/share/nginx/html;
        #     expires 1y;
        #     add_header Cache-Control "public";
        #     access_log off;
        # }

        location /api {
            proxy_pass http://backend/;
        }

        location /test303 {
          return 302 https://www.baidu.com;
        }

        location /test301 {
          return 301 https://account.wps.cn;
        }

        location /ping {
            proxy_pass https://docs.wps.com/ping;
            proxy_set_header Host docs.wps.com;
        }
    }
}